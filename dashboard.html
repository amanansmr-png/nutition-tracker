<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Nutri Tracker - View daily nutrition totals, track water, and log active energy burned.">
  <title>Nutri Tracker — Dashboard</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    @media (max-width: 1024px) {
      #dashboardFoodLogCard {
        grid-column: span 2;
      }
    }
    @media (max-width: 768px) {
      #dashboardFoodLogCard {
        grid-column: span 1;
      }
    }
  </style>
</head>
<body>
  <!-- Animated Background Orbs -->
  <div class="bg-orbs">
    <div class="orb"></div>
    <div class="orb"></div>
    <div class="orb"></div>
    <div class="orb"></div>
  </div>

  <div class="app-container">
    <main class="main-content">
      <div class="page-header">
        <h1>Dashboard</h1>
        <p>Track your daily nutrition and goals</p>
      </div>

      <div class="dashboard-grid">
        <!-- Calorie Ring Card -->
        <div class="glass-card flex-col items-center justify-center text-center">
          <div class="section-header">
            <h2>Calorie Target</h2>
            <p>Daily intake tracker</p>
          </div>
          <div class="calorie-ring-container">
            <div class="calorie-ring">
              <svg viewBox="0 0 200 200">
                <defs>
                  <linearGradient id="ringGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="var(--accent-purple)"/>
                    <stop offset="100%" stop-color="var(--accent-violet)"/>
                  </linearGradient>
                </defs>
                <circle class="calorie-ring-bg" cx="100" cy="100" r="85"/>
                <circle id="calorieRingFill" class="calorie-ring-fill" cx="100" cy="100" r="85"/>
              </svg>
              <div class="calorie-ring-text">
                <div id="calNumber" class="cal-number">0</div>
                <div class="cal-label">kcal consumed</div>
                <div id="calRemaining" class="cal-goal">0 remaining</div>
              </div>
            </div>
          </div>
        </div>

        <!-- Macros Card -->
        <div class="glass-card">
          <div class="section-header">
            <h2>Macronutrients</h2>
            <p>Daily protein, carbs, fats, & fiber</p>
          </div>
          <div id="macrosList" class="flex flex-col">
            <!-- Dynamically populated -->
          </div>
        </div>

        <!-- Water Tracker & Activity Card -->
        <div class="glass-card flex-col gap-24">
          <!-- Water Tracker Section -->
          <div class="flex flex-col gap-12">
            <div class="section-header">
              <h2>Water Intake</h2>
              <p id="waterLabel">0 / 8 glasses</p>
            </div>
            <div id="waterGlasses" class="water-glasses">
              <!-- Dynamically populated -->
            </div>
          </div>

          <!-- Activity Section -->
          <div class="flex flex-col gap-12" style="border-top: 1px solid var(--border-glass); padding-top: 20px;">
            <div class="section-header">
              <h2>Active Calories</h2>
              <p>Burned: <span id="burnedValue" style="font-weight:700; color:var(--accent-orange);">0</span> kcal</p>
            </div>
            <div class="flex gap-8">
              <input type="number" id="burnedInput" class="input-field" placeholder="Kcal burned" min="1">
              <button class="btn btn-primary" onclick="addBurnedCalories()">Log</button>
            </div>
          </div>
        </div>

        <!-- Food Log Card -->
        <div class="glass-card" style="grid-column: span 3;" id="dashboardFoodLogCard">
          <div class="section-header">
            <h2>Food Log</h2>
            <p>Meals logged today</p>
            <button class="btn btn-primary btn-sm" onclick="window.location.href='search.html'">Add Food</button>
          </div>
          <div id="foodLogList" class="scroll-list">
            <!-- Dynamically populated -->
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Firebase compatibility SDKs -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/app.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
