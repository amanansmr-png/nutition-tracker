<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Nutri Tracker - View your 7-day intake charts and look back at historical daily records.">
  <title>Nutri Tracker — History</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* Styling for horizontal goal line in chart */
    .goal-line {
      position: absolute;
      left: 0;
      right: 0;
      height: 1px;
      border-top: 1px dashed rgba(239, 68, 68, 0.4);
      z-index: 10;
      pointer-events: none;
      transition: bottom 0.5s ease;
    }
    .goal-line-label {
      position: absolute;
      right: 12px;
      top: -18px;
      font-size: 0.65rem;
      font-weight: 600;
      color: var(--accent-red);
      background: rgba(20, 10, 40, 0.95);
      border: 1px solid rgba(239, 68, 68, 0.25);
      padding: 2px 8px;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <!-- Animated Background Orbs -->
  <div class="bg-orbs">
    <div class="orb"></div>
    <div class="orb"></div>
    <div class="orb"></div>
    <div class="orb"></div>
  </div>

  <div class="app-container">
    <main class="main-content">
      <div class="page-header">
        <h1>Nutrition History</h1>
        <p>Review patterns and weekly compliance charts</p>
      </div>

      <div class="grid-2">
        <div class="flex flex-col gap-24">
          <!-- 7-Day Chart Card -->
          <div class="glass-card">
            <div class="section-header">
              <h2>7-Day Intake Trend</h2>
              <p>Compare daily calories with target (click bars to inspect)</p>
            </div>
            <div class="chart-container">
              <div id="goalLine" class="goal-line">
                <div class="goal-line-label">Goal: 2000 kcal</div>
              </div>
              <div id="chartBars" class="chart-bar-group">
                <!-- Dynamically populated chart bars -->
              </div>
            </div>
          </div>

          <!-- Weekly Summary Card -->
          <div class="glass-card">
            <div class="section-header">
              <h2>Weekly Performance</h2>
              <p>Totals and averages over the last 7 days</p>
            </div>
            <div id="weekSummary">
              <!-- Dynamically populated averages -->
            </div>
          </div>
        </div>

        <div>
          <!-- Day Breakdown Card -->
          <div class="glass-card" id="dayBreakdown">
            <!-- Dynamically populated single-day breakdown -->
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Firebase compatibility SDKs -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/app.js"></script>
  <script src="js/history.js"></script>
</body>
</html>
